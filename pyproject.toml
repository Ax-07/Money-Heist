[project]
name = "money-heist"
version = "0.1.0"
description = "Fondations backend de Money Heist, plateforme de trading crypto assistée par IA."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.extend-per-file-ignores]
"scripts/*.py" = ["E402"]
"scripts/market_data/*.py" = ["E402"]
"app/agents/prompts.py" = ["E501"]

"app/agents/core.py" = ["UP047"]
"app/evaluation/ablation_campaign.py" = ["UP047"]
"app/intelligence/ai_gateway/gateway.py" = ["UP046"]
"app/intelligence/ai_gateway/models.py" = ["UP046"]
"app/recruitment/campaign_execution.py" = ["UP047"]
"app/services/backtest/ablation_runtime.py" = ["UP040"]
"app/trading/paper/models.py" = ["UP042"]
